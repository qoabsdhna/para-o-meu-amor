<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Surpresa Romântica 💖</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to right, #ffdde1, #ee9ca7);
      text-align: center;
      color: #4a2c2a;
      margin: 0;
      padding: 0;
      position: relative;
      overflow-x: hidden;
    }
    h1 {
      margin-top: 30px;
      font-size: 2.5em;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin: 20px;
      position: relative;
    }
    .gallery img {
      width: 250px;
      height: auto;
      margin: 10px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.3s;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }
    .message {
      font-size: 1.2em;
      margin: 30px;
      background: rgba(255,255,255,0.7);
      padding: 20px;
      border-radius: 10px;
      display: inline-block;
      position: relative;
    }
    /* Corações animados */
    .heart {
      position: absolute;
      color: red;
      font-size: 24px;
      animation: float 6s infinite;
    }
    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      50% { transform: translateY(-100px) rotate(20deg); opacity: 0.7; }
      100% { transform: translateY(-200px) rotate(-20deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <h1>Para Você, Meu Amor 💕</h1>
  <div class="gallery">
    <img src="foto1.jpeg.jpeg" alt="Nós dois">
    <img src="foto2.jpeg.jpeg" zalt="Momentos felizes">
    <img src="foto3.jpeg.jpeg" alt="Amor eterno">
  </div>
  <div class="message">
    <p>Você é a razão da minha felicidade. Cada foto é uma lembrança do quanto eu te amo. 💖</p>
  </div>

  <!-- Corações espalhados -->
  <div class="heart" style="top:80%; left:10%;">❤️</div>
  <div class="heart" style="top:85%; left:30%;">💖</div>
  <div class="heart" style="top:90%; left:50%;">💕</div>
  <div class="heart" style="top:75%; left:70%;">💞</div>
  <div class="heart" style="top:80%; left:90%;">💓</div>
</body>
</html>
